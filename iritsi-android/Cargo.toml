[package]
name = "iritsi-android"
version = "0.1.0"
authors = ["xnacly <47723417+xNaCly@users.noreply.github.com>"]
edition = "2021"

[[bin]]
name = "iritsi"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
iritsi-core = { path = "../iritsi-core", features = ["bundled-feed"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
serde_json = "1"

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
